# House standard: GitLab CI (theo sellback-* repos). Gate nằm ngoài agent — CI giữ công tắc (architecture.md §10).
stages:
  - lint
  - test
  - eval

lint:
  stage: lint
  image: python:3.12-slim
  script:
    - pip install ruff
    - ruff check .

test:
  stage: test
  image: python:3.12-slim
  script:
    - pip install -e ".[dev]"
    - pytest -q

# M4: eval scenarios (A–F) — evidence cho release. Mọi version phải pass (chạy cùng test).
# G1 — HITL release gate: when: manual, người duyệt xem evidence rồi bấm chạy (architecture.md §10).
eval-scenarios:
  stage: eval
  image: python:3.12-slim
  script:
    - pip install -e ".[dev]"
    - python -m evals.run
  when: manual
