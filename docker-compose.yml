# Local infra cho M1: Milvus standalone (vector) + Neo4j (knowledge graph)
# Khởi động: docker compose up -d   (cần Docker Desktop đang chạy)
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # minio/minio bị gỡ khỏi Docker Hub (2025) — dùng bản Bitnami legacy (S3-compatible)
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      # Image khai báo VOLUME /bitnami/minio/data → PHẢI mount named volume đúng vào
      # path data đó. Mount /bitnami/minio sẽ bị anonymous volume che mất data:
      # mỗi lần recreate container là mất trắng object store (404 SLICE_META).
      - minio:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  milvus:
    image: milvusdb/milvus:v2.6.0
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"   # gRPC — pymilvus
      - "9091:9091"     # health metrics
    volumes:
      - milvus:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j_local_dev}
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data

volumes:
  etcd:
  minio:
  milvus:
  neo4j_data:
